name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m app.commands migrate
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./vigilon-ci-migrate.db
          VIGILON_SECRET_KEY: ci-only-signing-key
          VIGILON_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - run: python -m compileall -q backend/app
      - run: node --check frontend/app.js
      - run: pytest -q backend/tests
        env:
          VIGILON_SECRET_KEY: ci-only-signing-key
          VIGILON_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DATABASE_URL: sqlite:///./vigilon-ci.db
          PYTHONPATH: backend
